name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-toolchain
        with:
          profile: base
      - name: Validate every registered module
        id: modules
        run: escript scripts/fluentci_modules_ci validate-modules --github-output
      - name: Test CI validators
        run: |
          escript scripts/fluentci_modules_ci test
          node --test test/ci/*.test.mjs lib/component/test/*.test.mjs
      - name: Check generated Buildx sources and schema
        run: escript scripts/fluentci_modules_ci generate-buildx --check
      - name: Check generated CLI sources and schemas
        run: escript scripts/fluentci_modules_ci generate-cli --check
      - name: Check generated setup and service sources
        run: |
          escript scripts/fluentci_modules_ci generate-setup --check
          escript scripts/fluentci_modules_ci generate-services --check
      - name: Check typed component sources and schemas
        run: escript scripts/fluentci_modules_ci generate-components --check
      - name: Check typed setup dependencies and source locks
        run: escript scripts/fluentci_modules_ci generate-dependencies --check
      - name: Audit pipeline exports
        run: escript scripts/fluentci_modules_ci audit-modules --check
      - name: Lint workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  modules:
    name: Modules ${{ matrix.shard }} / ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      FLUENTCI_REQUIRE_NATIVE_TESTS: '1'
      MODULE_BATCH: ${{ toJSON(matrix.modules) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-toolchain
      - name: Install Linux integration tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev rpm zip unzip
      - name: Install formatter and linter integration tools
        if: matrix.formatters
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cli-python"
          "$RUNNER_TEMP/cli-python/bin/pip" install black==25.1.0 ruff==0.11.5 yamllint==1.37.0 sqlfluff==4.5.0 sqruff==0.44.0
          mkdir -p "$RUNNER_TEMP/cli-node"
          bun add --cwd "$RUNNER_TEMP/cli-node" --dev --exact prettier@3.5.3 @biomejs/biome@1.9.4
          npm_package_version=0.58.0 bun add --cwd "$RUNNER_TEMP/cli-node" --dev --exact --trust protolint@0.58.0
          {
            echo "$RUNNER_TEMP/cli-python/bin"
            echo "$RUNNER_TEMP/cli-node/node_modules/.bin"
          } >> "$GITHUB_PATH"
          if ! command -v rustfmt >/dev/null; then rustup component add rustfmt; fi
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get install --yes --no-install-recommends shellcheck
            else
              brew install shellcheck
            fi
          fi
          echo 'FLUENTCI_REQUIRE_CLI_NATIVE_TESTS=1' >> "$GITHUB_ENV"
      - name: Require uv integration tests
        if: matrix.uv
        run: echo 'FLUENTCI_REQUIRE_CLI_NATIVE_TESTS=1' >> "$GITHUB_ENV"
      - name: Require upload adapter tests
        if: matrix.bun
        run: echo 'FLUENTCI_REQUIRE_ARTIFACT_TESTS=1' >> "$GITHUB_ENV"
      - name: Install browser testing tools with Bun
        if: matrix.browser
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tools"
          export CYPRESS_CACHE_FOLDER="$RUNNER_TEMP/cypress-cache"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers"
          bun add --cwd "$RUNNER_TEMP/browser-tools" --dev --exact @playwright/test@1.65.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install --yes --no-install-recommends \
              libgtk-3-0t64 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
          fi
          CYPRESS_INSTALL_BINARY=0 bun add --cwd "$RUNNER_TEMP/browser-tools" --dev --exact cypress@16.2.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/cypress" install
          {
            echo "CYPRESS_CACHE_FOLDER=$CYPRESS_CACHE_FOLDER"
            echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
            echo "FLUENTCI_BROWSER_TOOLS=$RUNNER_TEMP/browser-tools"
            echo 'FLUENTCI_REQUIRE_BROWSER_TESTS=1'
          } >> "$GITHUB_ENV"
      - name: Install offline security integration tools
        if: toJSON(matrix.security) != '[]'
        shell: bash
        run: |
          escript scripts/fluentci_modules_ci install-security-test-tools --directory "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
          echo 'FLUENTCI_REQUIRE_SECURITY_TESTS=1' >> "$GITHUB_ENV"
      - name: Install native build integration tools
        if: matrix.build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install --yes --no-install-recommends cmake meson ninja-build sccache build-essential
          else
            brew install cmake meson ninja sccache
          fi
          echo 'FLUENTCI_REQUIRE_BUILD_TESTS=1' >> "$GITHUB_ENV"
      - name: Cache PureScript dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/spago-nodejs
            ~/Library/Caches/spago-nodejs
            */*/.spago
          key: spago-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('**/spago.lock') }}
      - name: Build and test every module in this batch
        run: escript scripts/fluentci_modules_ci test-module-batch --modules-env MODULE_BATCH --log-dir "$RUNNER_TEMP/module-logs"
      - name: Verify the build preserves committed files
        run: git diff --exit-code
      - name: Upload test log and plugin
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: modules-${{ matrix.shard }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/module-logs/
            */*/dist/plugin.wasm
          if-no-files-found: warn
          retention-days: 7

  complete:
    name: All modules passed
    if: always()
    needs: [validate, modules]
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation and every module job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          MODULE_RESULT: ${{ needs.modules.result }}
        run: test "$VALIDATION_RESULT" = success && test "$MODULE_RESULT" = success
