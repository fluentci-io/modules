name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate every registered module
        id: modules
        run: python scripts/validate_modules.py --github-output
      - name: Test CI validators
        run: |
          python -m unittest discover -s test/ci -p 'test_*.py' -v
          node --test test/ci/*.test.mjs
      - name: Check generated Buildx sources and schema
        run: python containers/buildx/generate.py --check
      - name: Check generated CLI sources and schemas
        run: python scripts/generate_cli_modules.py --check
      - name: Lint workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  modules:
    name: ${{ matrix.name }} / ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      FLUENTCI_REQUIRE_NATIVE_TESTS: '1'
      MODULE_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-toolchain
      - name: Install Linux integration tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev rpm zip unzip
      - name: Install formatter and linter integration tools
        if: startsWith(matrix.path, 'formatting/') || contains(fromJSON('["ruff", "biome", "shellcheck", "yamllint"]'), matrix.name)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cli-python"
          "$RUNNER_TEMP/cli-python/bin/pip" install black==25.1.0 ruff==0.11.5 yamllint==1.37.0
          npm install --prefix "$RUNNER_TEMP/cli-node" prettier@3.5.3 @biomejs/biome@1.9.4
          echo "$RUNNER_TEMP/cli-python/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cli-node/node_modules/.bin" >> "$GITHUB_PATH"
          if ! command -v rustfmt >/dev/null; then rustup component add rustfmt; fi
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get install --yes --no-install-recommends shellcheck
            else
              brew install shellcheck
            fi
          fi
          echo 'FLUENTCI_REQUIRE_CLI_NATIVE_TESTS=1' >> "$GITHUB_ENV"
      - name: Install uv integration tool
        if: matrix.name == 'uv'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cli-uv"
          "$RUNNER_TEMP/cli-uv/bin/pip" install uv==0.11.0
          echo "$RUNNER_TEMP/cli-uv/bin" >> "$GITHUB_PATH"
          echo 'FLUENTCI_REQUIRE_CLI_NATIVE_TESTS=1' >> "$GITHUB_ENV"
      - name: Cache PureScript dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/spago-nodejs
            ~/Library/Caches/spago-nodejs
            ${{ matrix.path }}/.spago
          key: spago-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles(format('{0}/spago.lock', matrix.path)) }}
      - name: Install module dependencies
        run: npm ci --prefix "$MODULE_PATH"
      - name: Build module
        run: npm run build --prefix "$MODULE_PATH"
      - name: Run all module tests
        shell: bash
        run: npm test --prefix "$MODULE_PATH" 2>&1 | tee "$RUNNER_TEMP/module-tests.log"
      - name: Validate compiled WASM entry points
        run: node scripts/validate_wasm.mjs "$MODULE_PATH"
      - name: Verify the build preserves committed files
        run: git diff --exit-code
      - name: Upload test log and plugin
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.name }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/module-tests.log
            ${{ matrix.path }}/dist/plugin.wasm
          if-no-files-found: warn
          retention-days: 7

  complete:
    name: All modules passed
    if: always()
    needs: [validate, modules]
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation and every module job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          MODULE_RESULT: ${{ needs.modules.result }}
        run: test "$VALIDATION_RESULT" = success && test "$MODULE_RESULT" = success
