name: Services E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/**'
      - 'lib/services/**'
      - 'test/services/**'
      - 'lib/component/**'
      - 'scripts/**'
      - 'test/ci/wasm.test.mjs'
      - '.github/workflows/services-e2e.yml'
      - '.github/actions/setup-toolchain/**'
      - '.github/toolchain/versions.json'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'lib/services/**'
      - 'test/services/**'
      - 'lib/component/**'
      - 'scripts/**'
      - 'test/ci/wasm.test.mjs'
      - '.github/workflows/services-e2e.yml'
      - '.github/actions/setup-toolchain/**'
      - '.github/toolchain/versions.json'

permissions:
  contents: read

concurrency:
  group: services-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: All service components and native lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-toolchain
        with:
          profile: full
      - name: Cache PureScript package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/spago-nodejs
            services/*/.spago
            setup/docker/.spago
            setup/curl/.spago
          key: services-spago-${{ runner.os }}-${{ hashFiles('services/**/spago.lock', 'setup/docker/spago.lock', 'setup/curl/spago.lock') }}
      - name: Build components in parallel and verify service lifecycles
        env:
          SERVICE_LOG_DIR: ${{ runner.temp }}/service-e2e-logs
          SERVICE_BUILD_CONCURRENCY: '32'
        run: escript scripts/fluentci_modules_ci test-services
      - name: Verify committed files stay unchanged
        run: git diff --exit-code
      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: service-e2e-logs
          path: ${{ runner.temp }}/service-e2e-logs/
          if-no-files-found: warn
          retention-days: 7
