name: Runtime setup smoke tests

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream:
    name: Live runtime installs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-toolchain
      - name: Validate registered modules
        run: escript scripts/fluentci_modules_ci validate-modules
      - name: Install Linux runtime test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zip unzip
      - name: Build runtime setup modules
        shell: bash
        run: |
          for runtime in bun deno elixir erlang gh gleam go java android node pkl purescript rust zig; do
            directory="setup/$runtime"
            npm ci --prefix "$directory"
            npm run build --prefix "$directory"
            escript scripts/fluentci_modules_ci validate-wasm "$directory"
          done
      - name: Install Erlang through the new component
        run: escript scripts/fluentci_modules_ci setup-toolchain --file setup/erlang/dist/plugin.wasm -- --version 29.1.2
      - name: Verify Erlang and GitHub CLI setup modules
        run: node --test setup/erlang/test/*.test.mjs setup/gh/test/*.test.mjs
      - name: Verify real Android SDK and Java component dependency
        shell: bash
        env:
          FLUENTCI_ANDROID_E2E: '1'
        run: node --test setup/android/test/e2e.test.mjs 2>&1 | tee "$RUNNER_TEMP/android-e2e.log"
      - name: Install and execute real upstream runtimes in temporary directories
        shell: bash
        env:
          FLUENTCI_SETUP_LIVE: '1'
          FLUENTCI_REQUIRE_NATIVE_TESTS: '1'
          FLUENTCI_SETUP_ELIXIR_VERSION: ${{ runner.os == 'Linux' && '1.18.0' || 'latest' }}
        run: |
          tests=()
          for runtime in bun deno elixir gleam go java node pkl purescript rust zig; do
            tests+=("setup/$runtime/test/setup.test.mjs")
          done
          node --test --test-name-pattern='actual upstream release' "${tests[@]}" 2>&1 | tee "$RUNNER_TEMP/setup-smoke.log"
      - name: Preserve smoke test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: setup-smoke-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/setup-smoke.log
            ${{ runner.temp }}/android-e2e.log
          if-no-files-found: warn
          retention-days: 7
