name: Setup CI toolchain
description: Install the CI toolchain through published FluentCI setup components.
inputs:
  profile:
    description: base installs Node, Bun, uv and Python; full also installs PureScript and Spago.
    required: false
    default: full
runs:
  using: composite
  steps:
    - name: Install Linux compiler libraries
      if: runner.os == 'Linux' && inputs.profile == 'full'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libgmp10 libtinfo6
    - name: Cache published components and installed toolchains
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cache/fluentci-ci
          ~/.local/share/fluentci
          ~/.local/share/uv
          ~/.cache/uv
        key: fluentci-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('.github/toolchain/versions.json', 'scripts/setup_ci_toolchain.py') }}
    - name: Install published setup modules
      shell: bash
      env:
        SETUP_PROFILE: ${{ inputs.profile }}
      run: python3 scripts/setup_ci_toolchain.py --profile "$SETUP_PROFILE"
    - name: Install pinned component build tools
      shell: bash
      run: bun install --cwd lib/component --frozen-lockfile
    - name: Verify the component compiler
      shell: bash
      run: node -e 'import("./lib/component/node_modules/@bytecodealliance/componentize-js/src/componentize.js").then(() => console.log("ComponentizeJS ready"))'
