name: Setup CI toolchain
description: Bootstrap a verified FluentCI CLI, compile BEAM helpers through published Erlang/Gleam modules, and install the CI toolchain.
inputs:
  profile:
    description: base installs Node, Bun, uv and Python; full also installs PureScript and Spago.
    required: false
    default: full
runs:
  using: composite
  steps:
    - name: Install Linux compiler libraries
      if: runner.os == 'Linux' && inputs.profile == 'full'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libgmp10 libtinfo6
    - name: Cache verified downloads and managed Python
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cache/fluentci-ci
          ~/.local/share/uv
          ~/.cache/uv
          ~/Library/Caches/uv
        key: fluentci-bootstrap-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('.github/toolchain/versions.json', 'scripts/manifest.toml', 'scripts/src/**') }}
    - name: Bootstrap checksum-verified FluentCI
      shell: bash
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=linux-x86_64 ;;
          Linux/ARM64) target=linux-aarch64 ;;
          macOS/X64) target=macos-x86_64 ;;
          macOS/ARM64) target=macos-aarch64 ;;
          *) echo "Unsupported CI host: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        config=.github/toolchain/versions.json
        version=$(jq -er '.fluentci.version' "$config")
        url=$(jq -er --arg target "$target" '.fluentci.assets[$target].url' "$config")
        digest=$(jq -er --arg target "$target" '.fluentci.assets[$target].sha256' "$config")
        prefix="$HOME/.cache/fluentci-ci/cli/$version"
        mkdir -p "$prefix/bin"
        archive="$prefix/release.tar.gz"
        verify_archive() {
          if command -v sha256sum >/dev/null; then
            printf '%s  %s\n' "$digest" "$1" | sha256sum --check -
          else
            printf '%s  %s\n' "$digest" "$1" | shasum -a 256 --check -
          fi
        }
        if [ ! -f "$archive" ] || ! verify_archive "$archive"; then
          trap 'rm -f "$archive.part"' EXIT
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 --max-filesize 134217728 "$url" --output "$archive.part"
          verify_archive "$archive.part"
          mv "$archive.part" "$archive"
        fi
        tar -xzf "$archive" -C "$prefix/bin" fluentci
        chmod 755 "$prefix/bin/fluentci"
        printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
        mkdir -p "$RUNNER_TEMP/fluentci-ci-bootstrap"
        printf '# Isolated registry resolution for the CI bootstrap.\n' > "$RUNNER_TEMP/fluentci-ci-bootstrap/fluentci.toml"
    - name: Install Erlang through FluentCI
      shell: bash
      working-directory: ${{ runner.temp }}/fluentci-ci-bootstrap
      run: |
        fluentci --check-update=false run @fluentci.io/setup-erlang@0.2.0 setup --version "$(jq -er .beam.erlang "$GITHUB_WORKSPACE/.github/toolchain/versions.json")" --install-dir "$RUNNER_TEMP/fluentci-ci-erlang"
        printf '%s\n' "$RUNNER_TEMP/fluentci-ci-erlang/bin" >> "$GITHUB_PATH"
    - name: Install Gleam through FluentCI
      shell: bash
      working-directory: ${{ runner.temp }}/fluentci-ci-bootstrap
      run: |
        fluentci --check-update=false run @fluentci.io/setup-gleam@0.2.0 setup --version "$(jq -er .beam.gleam "$GITHUB_WORKSPACE/.github/toolchain/versions.json")" --install-dir "$RUNNER_TEMP/fluentci-ci-gleam"
        printf '%s\n' "$RUNNER_TEMP/fluentci-ci-gleam/bin" >> "$GITHUB_PATH"
    - name: Cache BEAM helper dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: scripts/build
        key: modules-ci-beam-${{ runner.os }}-${{ runner.arch }}-otp29.1.2-gleam1.19.2-${{ hashFiles('scripts/gleam.toml', 'scripts/manifest.toml', 'scripts/src/**', '.github/toolchain/versions.json') }}
    - name: Compile BEAM escript
      shell: bash
      working-directory: scripts
      run: |
        gleam build --target erlang --warnings-as-errors
        gleam export escript
        git diff --exit-code -- gleam.toml manifest.toml
    - name: Install published setup modules
      shell: bash
      env:
        SETUP_PROFILE: ${{ inputs.profile }}
      run: escript scripts/fluentci_modules_ci setup-toolchain --profile "$SETUP_PROFILE"
    - name: Install pinned component build tools
      shell: bash
      run: bun install --cwd lib/component --frozen-lockfile
    - name: Verify the component compiler
      shell: bash
      run: node -e 'import("./lib/component/node_modules/@bytecodealliance/componentize-js/src/componentize.js").then(() => console.log("ComponentizeJS ready"))'
