name: Setup CI toolchain
description: Install the pinned Node, Python, PureScript, Spago, and Extism build tools.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/toolchain/package-lock.json
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Install Linux compiler libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libgmp10 libtinfo6
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: tools
      with:
        path: ~/.cache/fluentci-ci/toolchain
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/toolchain/**', 'scripts/install_ci_toolchain.py') }}
    - name: Install pinned compilers
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: python scripts/install_ci_toolchain.py --directory "$HOME/.cache/fluentci-ci/toolchain"
    - name: Add tools to PATH
      shell: bash
      run: |
        echo "$HOME/.cache/fluentci-ci/toolchain/bin" >> "$GITHUB_PATH"
        echo "$HOME/.cache/fluentci-ci/toolchain/npm/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$HOME/.cache/fluentci-ci/toolchain/binaryen/bin" >> "$GITHUB_PATH"
    - name: Verify tools
      shell: bash
      run: |
        node --version
        purs --version
        spago --version
        extism-js --version
        wasm-opt --version
        wasm-merge --version
